# 문서 열람 권한 규칙 (설계서 12.4)
#
# - pattern: 문서 폴더(config.toml [paths] doc_dir) 기준 상대 경로. 소문자, 폴더 구분은 '/'.
#            와일드카드 * ? [..] 를 쓸 수 있다 (fnmatch). 예: "인사/*", "*급여*", "37_*.pdf"
# - groups : 그 문서를 볼 수 있는 그룹 목록. 사용자 그룹은 인증 게이트웨이의 X-User-Groups 로 받는다.
# - 맞는 규칙이 여럿이면 그룹을 합친다. 하나도 없으면 [index] default_acl (기본 ["all"] = 모두 공개).
# - 규칙을 바꾼 뒤 `python run.py build` 를 돌리면 바뀐 문서의 acl 만 갱신한다 (다시 파싱하지 않는다).
#
# 권한 원천 시스템이 정해지면(13장 열린 질문 1) 이 파일 대신 그 시스템에서 받아 오도록 acl.py 를 바꾼다.
#
# 예시 (지금은 모두 주석 = 모든 문서 공개)
# [[rule]]
# pattern = "37_*"
# groups  = ["legal"]
#
# [[rule]]
# pattern = "03.경조사지원규정*"
# groups  = ["hr"]
